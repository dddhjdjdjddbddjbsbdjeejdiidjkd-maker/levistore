<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bot Ops Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080C14;--card:#0E1421;--card2:#121929;--border:#1C2740;
  --cyan:#00D9FF;--text:#E4EDFF;--muted2:#6B7FA3;
  --red:#FF4757;--green:#00E676;--gold:#FFD740;
}
body{background:var(--bg);color:var(--text);font-family:'Tajawal',sans-serif;
  min-height:100vh;max-width:430px;margin:0 auto;overflow-x:hidden;}

/* HEADER */
.header{position:sticky;top:0;z-index:100;background:var(--bg);
  border-bottom:1px solid var(--border);padding:12px 16px;}
.hrow{display:flex;align-items:center;gap:8px;}
.icon-btn{flex-shrink:0;width:38px;height:38px;border-radius:10px;
  background:var(--card2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s;color:var(--muted2);}
.icon-btn:hover,.icon-btn:active{border-color:var(--cyan);color:var(--cyan);}
.icon-btn svg{display:block;}
.status-badge{display:flex;align-items:center;gap:6px;padding:6px 10px;
  border-radius:8px;background:var(--card2);border:1px solid var(--border);
  font-size:12px;color:var(--muted2);white-space:nowrap;flex-shrink:0;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--red);animation:pred 2s infinite;}
.dot.on{background:var(--green);animation:pgrn 2s infinite;}
@keyframes pred{0%,100%{box-shadow:0 0 0 0 rgba(255,71,87,.5)}50%{box-shadow:0 0 0 5px rgba(255,71,87,0)}}
@keyframes pgrn{0%,100%{box-shadow:0 0 0 0 rgba(0,230,118,.5)}50%{box-shadow:0 0 0 5px rgba(0,230,118,0)}}
.bot-btn{flex:1;display:flex;align-items:center;justify-content:space-between;
  padding:8px 14px;background:var(--card2);border:1.5px solid var(--cyan);
  border-radius:10px;cursor:pointer;color:var(--text);
  font-family:'Tajawal',sans-serif;font-size:13px;transition:all .2s;}
.bot-btn:active{opacity:.8;}
.bname{flex:1;text-align:right;font-weight:500;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;}

/* PERIOD */
.period-row{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;}
.ptabs{display:flex;background:var(--card2);border:1px solid var(--border);
  border-radius:10px;padding:3px;gap:2px;}
.ptab{padding:5px 13px;border-radius:7px;font-size:12px;font-weight:600;
  cursor:pointer;transition:all .2s;color:var(--muted2);border:none;
  background:none;font-family:'Tajawal',sans-serif;}
.ptab.active{background:var(--cyan);color:#000;font-weight:700;}
.demo-tag{margin-right:auto;padding:5px 11px;border-radius:8px;
  border:1.5px solid var(--gold);color:var(--gold);font-size:11px;
  font-weight:700;background:rgba(255,215,64,.04);white-space:nowrap;}

/* CARDS */
.cards{padding:8px 14px 32px;display:flex;flex-direction:column;gap:12px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;
  padding:18px 18px 0;overflow:hidden;transition:border-color .2s;}
.card:hover{border-color:rgba(0,217,255,.25);}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;}
.cicon{width:42px;height:42px;border-radius:12px;display:flex;
  align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.c1{background:rgba(0,217,255,.1)}.c2{background:rgba(99,179,237,.1)}
.c3{background:rgba(167,139,250,.1)}.c4{background:rgba(255,165,0,.1)}
.c5{background:rgba(255,71,87,.1)}.c6{background:rgba(0,230,118,.1)}
.card-info{text-align:right;}
.clabel{font-size:13px;color:var(--muted2);font-weight:400;line-height:1;margin-bottom:4px;}
.cval{font-size:48px;font-weight:900;line-height:1;letter-spacing:-2px;color:var(--text);}
.cbadge{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;
  border-radius:6px;font-size:12px;font-weight:700;margin-top:5px;}
.cbadge.dn{background:rgba(255,71,87,.12);color:var(--red);}
.cbadge.up{background:rgba(0,230,118,.12);color:var(--green);}
canvas.chart{margin:10px -18px 0;height:75px!important;
  width:calc(100% + 36px)!important;display:block;}

/* EMPTY STATE */
.no-bot{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:70px 20px;text-align:center;color:var(--muted2);}
.no-bot-icon{font-size:60px;margin-bottom:16px;opacity:.4;}
.no-bot-title{font-size:19px;font-weight:700;color:var(--text);margin-bottom:8px;}
.no-bot-sub{font-size:14px;line-height:1.7;}

/* SHEET OVERLAY */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;
  display:none;align-items:flex-end;backdrop-filter:blur(5px);}
.overlay.open{display:flex;}
.sheet{background:#111827;border-radius:20px 20px 0 0;
  border-top:1px solid var(--border);padding:8px 20px 36px;
  width:100%;max-height:82vh;overflow-y:auto;animation:slideUp .28s ease;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 18px;}
.stitle{font-size:17px;font-weight:700;margin-bottom:16px;}

/* BOT LIST */
.bot-item{display:flex;align-items:center;padding:13px 0;
  border-bottom:1px solid var(--border);cursor:pointer;gap:12px;transition:opacity .15s;}
.bot-item:active{opacity:.6;}
.radio{width:21px;height:21px;border-radius:50%;border:2px solid #3D5070;
  flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:border-color .2s;}
.radio.on{border-color:var(--cyan);}
.radio.on::after{content:'';width:11px;height:11px;border-radius:50%;background:var(--cyan);}
.bitem-info{flex:1;text-align:right;}
.bitem-name{font-size:16px;font-weight:600;}
.bitem-sub{font-size:12px;color:var(--muted2);margin-top:2px;}
.del-btn{width:32px;height:32px;border-radius:8px;flex-shrink:0;
  background:rgba(255,71,87,.1);border:1px solid rgba(255,71,87,.2);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--red);font-size:15px;transition:all .2s;}
.del-btn:active{background:rgba(255,71,87,.3);}
.empty-bots{text-align:center;padding:30px 0 16px;color:var(--muted2);}
.add-btn{display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;margin-top:16px;padding:13px;border-radius:12px;
  background:rgba(0,217,255,.07);border:1.5px dashed rgba(0,217,255,.3);
  color:var(--cyan);font-family:'Tajawal',sans-serif;font-size:15px;
  font-weight:600;cursor:pointer;transition:all .2s;}
.add-btn:hover{background:rgba(0,217,255,.13);border-color:var(--cyan);}
.add-btn:active{opacity:.75;}

/* ADD FORM */
.back-link{display:flex;align-items:center;gap:8px;color:var(--cyan);
  font-size:14px;font-weight:600;cursor:pointer;margin-bottom:18px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;color:var(--muted2);margin-bottom:6px;font-weight:500;}
.field input{width:100%;background:var(--card2);border:1px solid var(--border);
  border-radius:10px;padding:11px 14px;color:var(--text);
  font-family:'Tajawal',sans-serif;font-size:15px;outline:none;
  direction:rtl;transition:border-color .2s;}
.field input:focus{border-color:var(--cyan);}
.field input::placeholder{color:#3D5070;}
.save-btn{width:100%;padding:13px;border-radius:12px;background:var(--cyan);
  border:none;color:#000;font-family:'Tajawal',sans-serif;font-size:16px;
  font-weight:700;cursor:pointer;margin-top:8px;transition:opacity .2s;}
.save-btn:active{opacity:.8;}
.err{border-color:var(--red)!important;}

/* SETTINGS */
.srow{display:flex;align-items:center;justify-content:space-between;
  padding:14px 0;border-bottom:1px solid var(--border);}
.srow:last-child{border-bottom:none;}
.srow-lbl{font-size:14px;color:var(--muted2);}
.toggle{width:44px;height:24px;background:var(--border);border-radius:12px;
  position:relative;cursor:pointer;transition:background .25s;}
.toggle.on{background:var(--cyan);}
.toggle::after{content:'';position:absolute;width:18px;height:18px;
  background:#fff;border-radius:50%;top:3px;right:3px;transition:right .25s;}
.toggle.on::after{right:calc(100% - 21px);}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .8s linear infinite;}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="hrow">
    <button class="icon-btn" id="btn-settings">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
    <button class="icon-btn" id="btn-refresh">
      <svg id="ricon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
      </svg>
    </button>
    <div class="status-badge">
      <div class="dot" id="dot"></div>
      <span id="stxt">غير متصل</span>
    </div>
    <button class="bot-btn" id="bot-btn">
      <span class="bname" id="bname">— اختر بوت —</span>
      <span style="color:var(--muted2);font-size:11px;margin-right:8px">▾</span>
    </button>
  </div>
</div>

<!-- PERIOD ROW -->
<div class="period-row">
  <div class="ptabs">
    <button class="ptab" data-p="1D">1D</button>
    <button class="ptab active" data-p="7D">7D</button>
    <button class="ptab" data-p="30D">30D</button>
    <button class="ptab" data-p="90D">90D</button>
  </div>
  <div class="demo-tag">بيانات تجريبية</div>
</div>

<!-- MAIN AREA -->
<div id="area"></div>

<!-- BOT PICKER OVERLAY -->
<div class="overlay" id="bot-ov">
  <div class="sheet">
    <div class="handle"></div>
    <div id="list-view">
      <div class="stitle">🤖 بوتاتك</div>
      <div id="bot-items"></div>
      <button class="add-btn" id="go-add">
        <span style="font-size:20px;line-height:1">+</span> إضافة بوت جديد
      </button>
    </div>
    <div id="add-view" style="display:none">
      <div class="back-link" id="go-back">← رجوع للقائمة</div>
      <div class="stitle">➕ بوت جديد</div>
      <div class="field">
        <label>اسم البوت *</label>
        <input type="text" id="inp-name" placeholder="مثال: بوت الدعم" maxlength="40" autocomplete="off">
      </div>
      <div class="field">
        <label>Bot Token *</label>
        <input type="text" id="inp-token" placeholder="123456789:ABCdefGHI..." autocomplete="off" dir="ltr" style="text-align:left;font-size:13px">
      </div>
      <div class="field">
        <label>يوزر التيليغرام (اختياري)</label>
        <input type="text" id="inp-user" placeholder="@username" maxlength="50" autocomplete="off" dir="ltr" style="text-align:left">
      </div>
      <div id="add-err" style="display:none;color:var(--red);font-size:13px;background:rgba(255,71,87,.08);border:1px solid rgba(255,71,87,.2);border-radius:10px;padding:10px 12px;margin-bottom:14px;"></div>
      <button class="save-btn" id="do-save">💾 حفظ البوت</button>
    </div>
  </div>
</div>

<!-- SETTINGS OVERLAY -->
<div class="overlay" id="set-ov">
  <div class="sheet">
    <div class="handle"></div>
    <div class="stitle">⚙️ الإعدادات</div>
    <div class="srow"><span class="srow-lbl">الإشعارات الفورية</span><div class="toggle on" onclick="this.classList.toggle('on')"></div></div>
    <div class="srow"><span class="srow-lbl">التحديث التلقائي</span><div class="toggle on" onclick="this.classList.toggle('on')"></div></div>
    <div class="srow"><span class="srow-lbl">الوضع المظلم</span><div class="toggle on"></div></div>
    <div class="srow"><span class="srow-lbl">إخفاء البيانات التجريبية</span><div class="toggle" onclick="this.classList.toggle('on')"></div></div>
    <div class="srow"><span class="srow-lbl">اللغة</span><span style="color:var(--cyan);font-size:13px;font-weight:600">العربية 🇸🇦</span></div>
  </div>
</div>

<script>
// STORAGE
const LS = {
  bots:   () => { try { return JSON.parse(localStorage.getItem('dash_bots')||'[]'); } catch { return []; } },
  save:   b  => localStorage.setItem('dash_bots', JSON.stringify(b)),
  selId:  () => localStorage.getItem('dash_sel') || '',
  setSel: id => localStorage.setItem('dash_sel', id),
  selBot: () => { const id=LS.selId(); return LS.bots().find(b=>b.id===id)||null; }
};

function addBot(name, username, token) {
  const bots = LS.bots(), id = 'b'+Date.now();
  bots.push({ id, name, username, token });
  LS.save(bots); return id;
}
function delBot(id) {
  LS.save(LS.bots().filter(b=>b.id!==id));
  if(LS.selId()===id){ LS.setSel(''); updateHeader(null); renderArea(); }
}

// HEADER
function updateHeader(bot) {
  document.getElementById('dot').className    = 'dot'+(bot?' on':'');
  document.getElementById('stxt').textContent = bot?'متصل':'غير متصل';
  document.getElementById('bname').textContent= bot?bot.name:'— اختر بوت —';
}

// BOT LIST
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderBotItems() {
  const bots=LS.bots(), selId=LS.selId(), el=document.getElementById('bot-items');
  if(!bots.length){ el.innerHTML='<div class="empty-bots"><div style="font-size:40px;margin-bottom:10px">🤖</div>لا يوجد بوتات محفوظة بعد</div>'; return; }
  el.innerHTML='';
  bots.forEach(bot=>{
    const item=document.createElement('div');
    item.className='bot-item'; item.dataset.id=bot.id;
    item.innerHTML=`
      <div class="radio ${bot.id===selId?'on':''}"></div>
      <div class="bitem-info">
        <div class="bitem-name">${esc(bot.name)}</div>
        ${bot.username?`<div class="bitem-sub">${esc(bot.username)}</div>`:''}
      </div>
      <button class="del-btn" data-id="${bot.id}">🗑</button>`;
    el.appendChild(item);
  });
}

document.getElementById('bot-items').addEventListener('click', e=>{
  const del=e.target.closest('.del-btn'), item=e.target.closest('.bot-item');
  if(del){ e.stopPropagation(); const id=del.dataset.id, name=LS.bots().find(b=>b.id===id)?.name||''; if(confirm(`حذف "${name}"؟`)){ delBot(id); renderBotItems(); } return; }
  if(item){ LS.setSel(item.dataset.id); updateHeader(LS.selBot()); closeBotOv(); renderArea(); }
});

function openBotOv(){ renderBotItems(); document.getElementById('list-view').style.display='block'; document.getElementById('add-view').style.display='none'; document.getElementById('bot-ov').classList.add('open'); }
function closeBotOv(){ document.getElementById('bot-ov').classList.remove('open'); }

document.getElementById('bot-btn').addEventListener('click', openBotOv);
document.getElementById('bot-ov').addEventListener('click', e=>{ if(e.target===document.getElementById('bot-ov')) closeBotOv(); });

document.getElementById('go-add').addEventListener('click', ()=>{
  ['inp-name','inp-token','inp-user'].forEach(i=>{ document.getElementById(i).value=''; document.getElementById(i).classList.remove('err'); });
  document.getElementById('add-err').style.display='none';
  document.getElementById('list-view').style.display='none';
  document.getElementById('add-view').style.display='block';
  setTimeout(()=>document.getElementById('inp-name').focus(),150);
});

document.getElementById('go-back').addEventListener('click', ()=>{
  document.getElementById('add-view').style.display='none';
  document.getElementById('list-view').style.display='block';
});

document.getElementById('do-save').addEventListener('click', ()=>{
  const name=(document.getElementById('inp-name').value||'').trim();
  const token=(document.getElementById('inp-token').value||'').trim();
  const user=(document.getElementById('inp-user').value||'').trim();
  const errEl=document.getElementById('add-err');
  const showErr=(msg)=>{ errEl.textContent=msg; errEl.style.display='block'; };

  if(!name){ document.getElementById('inp-name').classList.add('err'); document.getElementById('inp-name').focus(); showErr('⚠️ اسم البوت مطلوب'); setTimeout(()=>document.getElementById('inp-name').classList.remove('err'),2000); return; }
  if(!token||!token.includes(':')){ document.getElementById('inp-token').classList.add('err'); document.getElementById('inp-token').focus(); showErr('⚠️ التوكن غير صحيح'); setTimeout(()=>document.getElementById('inp-token').classList.remove('err'),2000); return; }

  const id=addBot(name, user?(user.startsWith('@')?user:'@'+user):'', token);
  LS.setSel(id); updateHeader(LS.selBot()); closeBotOv(); renderArea();
});

// SETTINGS
document.getElementById('btn-settings').addEventListener('click',()=>document.getElementById('set-ov').classList.add('open'));
document.getElementById('set-ov').addEventListener('click',e=>{ if(e.target===document.getElementById('set-ov')) document.getElementById('set-ov').classList.remove('open'); });

// REFRESH
document.getElementById('btn-refresh').addEventListener('click',()=>{
  document.getElementById('ricon').classList.add('spin');
  setTimeout(()=>document.getElementById('ricon').classList.remove('spin'),800);
  renderArea();
});

// PERIOD TABS
let period='7D';
document.querySelectorAll('.ptab').forEach(btn=>{
  btn.addEventListener('click',()=>{
    period=btn.dataset.p;
    document.querySelectorAll('.ptab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); renderArea();
  });
});

// METRICS
const METRICS=[
  {key:'active',  label:'النشطين',       icon:'⚡',cls:'c1',base:19,  chg:-96,color:'#00D9FF',trend:'down'},
  {key:'users',   label:'المستخدمين',    icon:'👥',cls:'c2',base:593, chg:-55,color:'#63B3ED',trend:'wave'},
  {key:'msgs',    label:'الرسائل',       icon:'💬',cls:'c3',base:2840,chg:12, color:'#A78BFA',trend:'up'},
  {key:'acts',    label:'النشاطات',      icon:'🔥',cls:'c4',base:1240,chg:8,  color:'#FFA500',trend:'up'},
  {key:'banned',  label:'المحظورين',     icon:'🚫',cls:'c5',base:12,  chg:-30,color:'#FF4757',trend:'down'},
  {key:'sessions',label:'الجلسات',       icon:'🔗',cls:'c6',base:441, chg:5,  color:'#00E676',trend:'stable'},
];
const PTS={1D:24,'7D':7,'30D':30,'90D':90};
const MULT={'1D':.25,'7D':1,'30D':3.5,'90D':10};
let charts={};

function genSeries(m,p){
  const n=PTS[p]||7, base=m.base*(MULT[p]||1);
  const bias=m.trend==='up'?.52:m.trend==='down'?.48:.505;
  let v=base,vals=[];
  for(let i=0;i<n;i++){ v+=(Math.random()-bias)*base*.13; v=Math.max(base*.25,Math.min(base*1.75,v)); vals.push(+v.toFixed(1)); }
  return vals;
}
function fmt(v){ if(v>=1e6)return(v/1e6).toFixed(1)+'M'; if(v>=1000)return(v/1000).toFixed(1)+'k'; return Math.round(v)+''; }

function renderArea(){
  const area=document.getElementById('area'), bot=LS.selBot();
  if(!bot){
    area.innerHTML=`<div class="no-bot"><div class="no-bot-icon">🤖</div><div class="no-bot-title">لم يتم اختيار بوت</div><div class="no-bot-sub">اضغط على "اختر بوت" في الأعلى<br>لإضافة بوتك أو اختيار بوت محفوظ</div></div>`;
    Object.values(charts).forEach(c=>{try{c.destroy();}catch{}}); charts={}; return;
  }
  area.innerHTML='<div class="cards" id="cards"></div>';
  const container=document.getElementById('cards');
  Object.values(charts).forEach(c=>{try{c.destroy();}catch{}}); charts={};

  METRICS.forEach(m=>{
    const data=genSeries(m,period), cur=data[data.length-1], up=m.chg>=0;
    const card=document.createElement('div'); card.className='card';
    card.innerHTML=`
      <div class="card-top">
        <div class="cicon ${m.cls}">${m.icon}</div>
        <div class="card-info">
          <div class="clabel">${m.label}</div>
          <div class="cval">${fmt(cur)}</div>
          <div class="cbadge ${up?'up':'dn'}">${up?'↑':'↓'} ${Math.abs(m.chg)}%</div>
        </div>
      </div>
      <canvas class="chart" id="cv-${m.key}"></canvas>`;
    container.appendChild(card);
    requestAnimationFrame(()=>{
      const cv=document.getElementById('cv-'+m.key); if(!cv)return;
      cv.width=(container.clientWidth-28)+36; cv.height=75;
      const ctx=cv.getContext('2d'), grad=ctx.createLinearGradient(0,0,0,75);
      grad.addColorStop(0,m.color+'44'); grad.addColorStop(1,m.color+'00');
      charts[m.key]=new Chart(ctx,{type:'line',data:{labels:data.map((_,i)=>i),datasets:[{data,borderColor:m.color,borderWidth:2,fill:true,backgroundColor:grad,tension:.45,pointRadius:0}]},options:{responsive:false,maintainAspectRatio:false,animation:{duration:700,easing:'easeInOutQuart'},plugins:{legend:{display:false},tooltip:{enabled:false}},scales:{x:{display:false},y:{display:false}}}});
    });
  });
}

// INIT
updateHeader(LS.selBot());
renderArea();
</script>
</body>
</html>
