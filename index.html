<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>ليفاي - متجر الألعاب</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Cairo', sans-serif; }
        body { background-color: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }

        /* شاشات الدخول */
        .auth-screen { background: #1e293b; padding: 30px; border-radius: 16px; width: 100%; max-width: 400px; margin-top: 50px; }
        .auth-screen h2 { text-align: center; color: #f59e0b; margin-bottom: 20px; }
        .auth-screen input { width: 100%; padding: 12px; margin: 10px 0; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; }
        .auth-screen button { width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        .auth-screen .toggle-text { text-align: center; margin-top: 15px; font-size: 14px; color: #94a3b8; cursor: pointer; }
        .auth-screen .toggle-text span { color: #3b82f6; font-weight: bold; }
        .hidden { display: none; }

        /* شاشة المتجر */
        .store-screen { width: 100%; max-width: 500px; display: none; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; width: 100%; max-width: 500px; }
        .logo h1 { color: #f59e0b; font-size: 24px; }
        .user-info { color: #94a3b8; font-size: 14px; }
        
        /* بطاقات المنتجات */
        .product-card { background: #1e293b; padding: 20px; border-radius: 16px; margin: 15px 0; }
        .product-card h3 { font-size: 18px; margin-bottom: 10px; }
        .price { color: #fbbf24; font-size: 22px; font-weight: bold; margin: 10px 0; }
        
        /* أزرار الشراء */
        .btn-order { background: #25D366; color: white; padding: 12px; border-radius: 10px; border: none; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; gap: 10px; }
        .btn-logout { background: #ef4444; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; }
        
        /* أزرار المساعدة */
        .btn-green { background: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-danger { background: #ef4444; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- 1. شاشة تسجيل الدخول -->
    <div id="authScreen" class="auth-screen">
        <h2>🏴‍☠️ ليفاي</h2>
        <form id="loginForm">
            <input type="text" id="loginEmail" placeholder="البريد الإلكتروني أو اسم المستخدم" required>
            <input type="password" id="loginPass" placeholder="كلمة المرور" required>
            <button type="submit">تسجيل الدخول</button>
        </form>
        <p class="toggle-text" onclick="toggleAuth()">ليس لديك حساب؟ <span>إنشاء حساب جديد</span></p>
    </div>

    <!-- 2. شاشة إنشاء حساب جديد -->
    <div id="regScreen" class="auth-screen hidden">
        <h2>🏴‍☠️ حساب جديد</h2>
        <form id="regForm">
            <input type="text" id="regName" placeholder="اسم المستخدم" required>
            <input type="text" id="regEmail" placeholder="البريد الإلكتروني" required>
            <input type="password" id="regPass" placeholder="كلمة المرور" required>
            <button type="submit">إنشاء الحساب</button>
        </form>
        <p class="toggle-text" onclick="toggleAuth()">لديك حساب؟ <span>تسجيل الدخول</span></p>
    </div>

    <!-- 3. شاشة المتجر (تظهر بعد الدخول) -->
    <div id="storeScreen" class="store-screen">
        <div class="header">
            <div class="logo"><h1>ليفاي 🔥</h1></div>
            <div style="display:flex; align-items:center; gap:15px;">
                <span id="userNameDisplay" class="user-info">أهلاً، زائر</span>
                <button class="btn-logout" onclick="logout()">خروج</button>
            </div>
        </div>

        <!-- المنتجات الخاصة بك -->
        <div class="product-card">
            <h3>متجر الركض</h3>
            <div class="price">$5.50</div>
            <button class="btn-order" onclick="buyProduct('#RD-L2000')">شراء عبر واتساب 💬</button>
        </div>
        
        <div class="product-card">
            <h3>ميدالية الاندفاع</h3>
            <div class="price">$2.20</div>
            <button class="btn-order" onclick="buyProduct('#RD-3-2000')">شراء عبر واتساب 💬</button>
        </div>
        
        <div class="product-card">
            <h3>سيزون كامل</h3>
            <div class="price">$9.50</div>
            <button class="btn-order" onclick="buyProduct('#SEASON-FULL')">شراء عبر واتساب 💬</button>
        </div>
        
        <div class="product-card">
            <h3>حساب جواهر لوتشي</h3>
            <div class="price">$5.50</div>
            <button class="btn-order" onclick="buyProduct('#LUFFY-GEMS')">شراء عبر واتساب 💬</button>
        </div>
    </div>

    <!-- نظام الجافا سكريبت لتشغيل الموقع -->
    <script>
        // التبديل بين شاشات الدخول والتسجيل
        function toggleAuth() {
            document.getElementById('authScreen').classList.toggle('hidden');
            document.getElementById('regScreen').classList.toggle('hidden');
        }
        
        // تسجيل الدخول
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('loginEmail').value;
            // محاكاة لدخول ناجح
            const user = { name: username };
            localStorage.setItem('user', JSON.stringify(user));
            showStore();
        });

        // إنشاء حساب جديد
        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            // محاكاة لإنشاء حساب ناجح
            const user = { name: name };
            localStorage.setItem('user', JSON.stringify(user));
            showStore();
        });

        // إظهار المتجر وإخفاء شاشات الدخول
        function showStore() {
            const user = JSON.parse(localStorage.getItem('user'));
            if (user && user.name) {
                document.getElementById('userNameDisplay').innerText = `أهلاً، ${user.name}`;
                document.getElementById('authScreen').classList.add('hidden');
                document.getElementById('regScreen').classList.add('hidden');
                document.getElementById('storeScreen').style.display = 'block';
            }
        }

        // تسجيل الخروج
        function logout() {
            localStorage.removeItem('user');
            location.reload();
        }

        // دالة الشراء عبر واتساب (رقمك هنا)
        function buyProduct(code) {
            // 🔴 غير الرقم التالي برقمك (مثال مصر: 2010xxxxxx بدون صفر أول)
            const number = "201115302169"; 
            const url = `https://wa.me/${number}?text=أريد شراء المنتج: ${code}`;
            window.open(url, '_blank');
        }

        // التحقق من حالة الدخول عند فتح الصفحة
        if (localStorage.getItem('user')) {
            showStore();
        }
    </script>
</body>
</html>
